<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        h1 {
            color: #1A5276;
            text-align: center;
        }
        p {
            font-size: 16px;
            line-height: 1.8;
        }
    </style>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!--1. inline css: ditulis langsung di atribut style elemen -->
    <h1 style="color: blue; font-size: 28px;">SMK TJP</h1>
    <p style="color: gray; margin: 10px;"> THE WINNER </p>

    <!--2. internal css: ditulis di dalam tag <style> di bagian <head>-->
    <h1>HIDUP JOKOWI</h1>
    <p>ok gas ok gas</p>

    <!-- eksternal css: file .css terpisah, dihubungkan dengan tag <link>-->
     <h1 class="purple"> ITU GA RESPECT BANGET WOK</h1>
</body>
</html>
